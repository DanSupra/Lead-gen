name: "Automated PRs: CI + Idempotency"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create CI branch and open PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const baseBranch = 'main';
            const runSuffix = `-run-${process.env.GITHUB_RUN_NUMBER || Math.floor(Math.random()*100000)}`;
            const branchName = `ci/add-github-actions${runSuffix}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get the SHA of base branch
            const baseRef = await github.rest.git.getRef({
              owner, repo, ref: `heads/${baseBranch}`
            });
            const baseSha = baseRef.data.object.sha;

            // Create a new branch from base
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha
            });

            // Files to add on the new branch
            const files = {
              '.github/workflows/ci.yml': `name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: |
          pip install pytest
          pytest -q
`,
              '.pre-commit-config.yaml': `repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.236
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.2.0
    hooks:
      - id: mypy

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [commit]
`,
              'tests/test_smoke.py': `# Simple test to ensure CI runs

def test_smoke():
    assert True
`
            };

            // Create each file on the new branch
            for (const path of Object.keys(files)) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: `chore(ci): add ${path}`,
                content: Buffer.from(files[path]).toString('base64'),
                branch: branchName
              });
            }

            // Open a PR
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: "chore(ci): add GitHub Actions CI, pre-commit hooks, and test runner",
              head: branchName,
              base: baseBranch,
              body: `Adds GitHub Actions CI workflow to run ruff and pytest on PRs and pushes to main.

Includes .pre-commit-config.yaml and a smoke test (tests/test_smoke.py).

Verification:
1) Ensure Actions run on the PR and that lint/tests pass.
2) Locally: pip install -r requirements.txt; pre-commit install; pre-commit run --all-files; pytest -q`
            });

            core.info(`Created CI PR: ${pr.data.html_url}`);
            core.setOutput('ci_pr_url', pr.data.html_url);

      - name: Create idempotency branch and open PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const baseBranch = 'main';
            const runSuffix = `-run-${process.env.GITHUB_RUN_NUMBER || Math.floor(Math.random()*100000)}`;
            const branchName = `fix/idempotency${runSuffix}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const baseRef = await github.rest.git.getRef({
              owner, repo, ref: `heads/${baseBranch}`
            });
            const baseSha = baseRef.data.object.sha;

            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha
            });

            const files = {
              'app/idempotency.py': `# Lightweight idempotency helper: dedupe by leadgen_id before creating a Lead.
# This function is a helper; adapt to your DB/session/ORM setup.
def find_or_create_lead(session, Lead, lead_data: dict) -> dict:
    leadgen_id = lead_data.get('leadgen_id')
    if leadgen_id:
        existing = session.query(Lead).filter_by(leadgen_id=leadgen_id).one_or_none()
        if existing`
