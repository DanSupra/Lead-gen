name: "Automated PRs: CI + Idempotency"

on:
  workflow_dispatch:

jobs:
  create-prs:
    runs-on: ubuntu-latest
    env:
      BRANCH_CI: ci/add-github-actions-${{ github.run_number }}
      BRANCH_IDEMP: fix/idempotency-${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch, add CI files, and commit
        run: |
          git switch -c "$BRANCH_CI"
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: |
          pip install pytest
          pytest -q
EOF

          cat > .pre-commit-config.yaml <<'EOF'
repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.236
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.2.0
    hooks:
      - id: mypy

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [commit]
EOF

          mkdir -p tests
          cat > tests/test_smoke.py <<'EOF'
# Simple test to ensure CI runs

def test_smoke():

